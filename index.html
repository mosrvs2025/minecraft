<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Voxelia</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app"></div>

  <div id="menu">
    <div class="card">
      <h1>Voxelia</h1>
      <p class="tag">A living, breathing voxel world</p>
      <label>Name <input id="name" maxlength="16" autocomplete="off" /></label>
      <label>Graphics
        <select id="quality">
          <option value="low">Low · best for phones</option>
          <option value="medium">Medium · sharp shadows</option>
          <option value="high">High · far view + GTAO</option>
        </select>
      </label>
      <button id="play">Play</button>
      <p id="status" class="small"></p>
    </div>
  </div>

  <div id="loading" hidden>Connecting…</div>

  <div id="hud" hidden>
    <div id="crosshair"></div>
    <div id="stats"></div>
    <div id="rpg-hud"></div>
    <div id="compass"></div>
    <button id="journal-btn">📖 <kbd>J</kbd></button>
    <button id="inv-btn">🎒 <kbd>I</kbd></button>
    <div id="players"></div>
    <button id="hack-btn">⚡ Hacks <kbd>H</kbd></button>
    <div id="active-hacks"></div>
    <div id="chatlog"></div>
    <input id="chatin" maxlength="200" placeholder="Say something…" hidden />
    <div id="blockname"></div>
    <div id="hotbar"></div>
    <div id="hint">Click to play · <b>WASD</b> move · <b>Space</b> jump (double = fly) · <b>Shift</b> sprint · <b>C</b> descend · <b>LMB/RMB</b> break/place · <b>T</b> chat · <b>H</b> hacks · <b>J</b> journal · Echoes: <b>E</b> dash · <b>Q</b> slam · <b>V</b> sense · <b>I</b> inventory · <b>R</b> ride · <b>G</b> fire</div>
  </div>

  <div id="battle" hidden>
    <div id="b-foes"></div>
    <div id="b-hero"></div>
    <div id="b-msg"></div>
    <div id="b-menu" hidden></div>
    <div id="ring" hidden></div>
  </div>
  <div id="pops"></div>
  <div id="banner" hidden></div>
  <div id="journal" hidden></div>
  <div id="shop" hidden></div>
  <div id="inv" hidden></div>

  <div id="hacks" hidden></div>

  <div id="touch" hidden>
    <div id="stick"><div id="knob"></div></div>
    <div class="btns">
      <button id="b-chat" class="tb small">💬</button>
      <button id="b-fly" class="tb small">✈️</button>
      <button id="b-sense" class="tb small" hidden>👁</button>
      <button id="b-ride" class="tb small">🚗</button>
      <button id="b-fire" class="tb small" hidden>🎯</button>
      <button id="b-dash" class="tb" hidden>💨</button>
      <button id="b-slam" class="tb" hidden>💥</button>
      <button id="b-break" class="tb">⛏</button>
      <button id="b-place" class="tb">▣</button>
      <button id="b-down" class="tb">▼</button>
      <button id="b-jump" class="tb big">▲</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
